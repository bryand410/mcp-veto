[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-veto"
version = "0.1.0"
description = "Hold a sensitive MCP tool call until a human approves it out of band."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "security", "ciba", "human-in-the-loop", "agents"]
dependencies = []

[project.scripts]
mcp-veto = "mcp_veto.cli:main"

[project.urls]
Homepage = "https://github.com/bryand410/mcp-veto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
